version: "2"

linters:
  default: standard
  enable:
    - revive
    - gocritic
    - gocyclo
    - prealloc
    - misspell
    - unconvert
    - nakedret
    - errorlint
    - durationcheck
    - nilnil
    - thelper
    - copyloopvar
    - intrange
    - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
